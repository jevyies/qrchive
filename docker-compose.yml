services:
  weddingdrive-db:
    image: postgres:16-alpine
    container_name: weddingdrive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jevyies
      POSTGRES_PASSWORD: weddingdrive123
      POSTGRES_DB: weddingdrivedb
    ports:
      - "5432:5432"
    volumes:
      - weddingdrive_pgdata:/var/lib/postgresql/data
  gusakh-db:
    image: postgres:16-alpine
    container_name: gusakh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jevyies
      POSTGRES_PASSWORD: gusakh123
      POSTGRES_DB: gusakhdb
    ports:
      - "5433:5432"  # Note: Host port changed to 5433
    volumes:
      - gusakh_pgdata:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: local-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: password
      PGADMIN_CONFIG_SERVER_MODE: "False"  # Disables multi-user prompt overhead for local dev
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - weddingdrive-db
      - gusakh-db

volumes:
  weddingdrive_pgdata:
  gusakh_pgdata:
  pgadmin_data: